name: Build release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package browser builds
        run: |
          cd dist/chrome
          zip -r ../clean-new-tab-chrome.zip .
          cd ../firefox
          zip -r ../clean-new-tab-firefox.zip .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/clean-new-tab-chrome.zip
          dist/clean-new-tab-firefox.zip
          --generate-notes
